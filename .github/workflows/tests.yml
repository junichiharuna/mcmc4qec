name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: |
          python -m pip install build pytest
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Confirm installed package and absent optional dependencies
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import mcmc4qec
          assert Path.cwd() / "src" not in Path(mcmc4qec.__file__).resolve().parents
          for module in ("pymatching", "ldpc", "bposd", "stim"):
              assert importlib.util.find_spec(module) is None, module
          print(mcmc4qec.__file__)
          PY
      - name: Test installed wheel
        run: python -m pytest --override-ini pythonpath= tests/ -q
      - name: Run example against installed wheel
        run: |
          python examples/bit_flip.py
          python examples/three_noise.py
          python examples/bar_ladder.py

  optional-decoders-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel with optional decoders
        run: |
          python -m pip install build pytest
          python -m build --wheel
          python -m pip install dist/*.whl 'pymatching>=2.4,<3' 'ldpc>=2.4,<3' 'bposd>=2.1,<3' 'stim>=1.16,<2'
      - name: Test installed wheel with optional decoders
        run: python -m pytest --override-ini pythonpath= tests/ -q
      - name: Run optional examples
        run: |
          python examples/stim_dem.py
          python examples/toric_pymatching.py
