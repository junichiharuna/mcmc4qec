name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs,test]"
      - name: Check documentation and build site
        timeout-minutes: 2
        run: |
          python -m pytest tests/test_docs_manifest.py -q
          python -m mkdocs build --strict
          python docs/check_site.py

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install type-check dependencies
        run: python -m pip install . mypy pytest
      - name: Check package and consumer typing
        timeout-minutes: 2
        run: |
          python -m mypy --strict src/mcmc4qec
          python -m pytest tests/test_typing.py -q

  core-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: |
          python -m pip install build pytest "pytest-xdist>=3,<4"
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Confirm installed package and absent optional dependencies
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import mcmc4qec
          assert Path.cwd() / "src" not in Path(mcmc4qec.__file__).resolve().parents
          for module in ("pymatching", "ldpc", "bposd", "stim"):
              assert importlib.util.find_spec(module) is None, module
          print(mcmc4qec.__file__)
          PY
      - name: Test installed wheel
        timeout-minutes: 5
        run: python -m pytest --override-ini pythonpath= tests/ -q -n auto --dist=worksteal
      - name: Verify core quick examples and documentation
        timeout-minutes: 5
        run: python -I docs/wp/verify_wheel.py core

  optional-decoders-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel with optional decoders
        run: |
          python -m pip install build pytest "pytest-xdist>=3,<4"
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          wheel = next(Path("dist").glob("*.whl"))
          subprocess.run([sys.executable, "-m", "pip", "install",
                          f"{wheel}[matching,bposd,codes,stim,plot,notebooks]"], check=True)
          PY
      - name: Test installed wheel with optional decoders
        timeout-minutes: 5
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          files = sorted(p.as_posix() for p in Path("tests").rglob("test_*.py"))
          shard = int(os.environ["TEST_SHARD"])
          selected = files[shard::4]
          assert 0 <= shard < 4 and selected
          Path("test-shard.json").write_text(json.dumps({
              "shard": shard, "shards": 4, "all_files": files, "selected": selected,
          }, indent=2), encoding="utf-8")
          print(f"Shard {shard}: {len(selected)}/{len(files)} test files", flush=True)
          subprocess.run([
              sys.executable, "-m", "pytest", "--override-ini", "pythonpath=",
              *selected, "-q", "-n", "auto", "--dist=worksteal",
              "--junitxml=test-results.xml",
          ], check=True)
          PY
      - name: Save shard inventory and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-tests-${{ matrix.python }}-${{ matrix.shard }}
          path: |
            test-shard.json
            test-results.xml
      - name: Verify all quick examples and notebooks
        if: matrix.shard == 0
        timeout-minutes: 5
        env:
          MCMC4QEC_QUICK: "1"
        run: python -I docs/wp/verify_wheel.py optional
