[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmc4qec"
version = "0.1.0.dev5"
description = "Reference rare-event MCMC primitives for quantum error correction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]
keywords = ["quantum error correction", "rare-event sampling", "MCMC", "splitting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/junichiharuna/mcmc4qec"
Issues = "https://github.com/junichiharuna/mcmc4qec/issues"
Documentation = "https://github.com/junichiharuna/mcmc4qec/blob/main/docs/api_en.md"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
matching = ["pymatching>=2.4,<3"]
bposd = ["ldpc>=2.4,<3"]
codes = ["ldpc>=2.4,<3", "bposd>=2.1,<3"]
stim = ["stim>=1.16,<2"]
plot = ["matplotlib>=3.7,<4"]
notebooks = ["nbclient>=0.9,<1", "nbformat>=5.9,<6", "ipykernel>=6,<8", "matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcmc4qec = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mcmc4qec"]

# ldpc exposes these public APIs by implicit re-export in its untyped package.
[[tool.mypy.overrides]]
module = ["ldpc", "ldpc.*"]
implicit_reexport = true

# Optional scientific backends do not all ship PEP 561 metadata.
[[tool.mypy.overrides]]
module = ["scipy.*", "bposd.*", "ldpc.*", "pymatching.*", "stim.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
